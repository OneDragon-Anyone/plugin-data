name: 转移插件
description: 插件换了仓库（不是改名或转让）、或需要更换维护者。
title: "[transfer] "
labels:
  - transfer
body:
  - type: input
    id: plugin_id
    attributes:
      label: 插件 ID
    validations:
      required: true
  - type: input
    id: new_repo
    attributes:
      label: 新仓库地址
      placeholder: https://github.com/new-owner/plugin-repo
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 原因
      description: 原作者同意转移时，请让原作者在本 Issue 下回复确认。
    validations:
      required: true
