name: Plugin submission
description: Submit a plugin to the public registry
title: "[Submission] "
labels:
  - plugin-submission
body:
  - type: input
    id: plugin_id
    attributes:
      label: Plugin ID
      description: Lowercase Python package style ID.
      placeholder: coffee_route_plus
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      placeholder: https://github.com/author/plugin-repo
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Short description
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      placeholder: daily, coffee, utility
  - type: dropdown
    id: risk
    attributes:
      label: Primary risk
      options:
        - filesystem
        - network
        - account
        - automation
        - ocr
        - yolo
        - clipboard
        - process
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Dependencies, compatibility, maintainer notes
