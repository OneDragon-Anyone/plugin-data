name: Validate Registry

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # 名称即 ruleset 中的必需检查；机器人 PR 由提交机器人写入同名 commit status
    name: registry/validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout template tools
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.TEMPLATE_REPOSITORY || 'OneDragon-Anyone/plugin-template' }}
          ref: ${{ vars.TEMPLATE_REF || 'v1' }}
          path: .plugin-template
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Validate registry entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEMPLATE_DIR: .plugin-template
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'registry/plugins/*.json' \
            | xargs -r -n1 basename | sed 's/\.json$//' | paste -sd, -)
          pnpm registry:check --resolve --deep "$changed"
