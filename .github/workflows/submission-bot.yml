name: submission-bot

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: submission-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # 默认两边都取最新，不用改
  #
  # 固定市场版本 —— 二选一，@ 后面只能写死，不能写变量：
  #   uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-submission-bot.yml@v1  # 用 v1 tag 的代码，不再变，其他版本以此类推
  #   uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-submission-bot.yml@master  # 用 master 分支最新代码
  #
  # 固定工具版本 —— 二选一：
  #   tools_ref: v1  # 用 v1 tag 的代码，不再变，其他版本以此类推
  #   tools_ref: ${{ vars.TOOLS_REF }}  # 读仓库变量，留空就用最新 tag
  #
  # 工具仓坐标、站点地址、站点 base 的默认值都写在这里，与 build-market 保持一致
  bot:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/recheck')) ||
      (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/sync'))
    uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-submission-bot.yml@master  # 用 master 分支最新代码
    with:
      tools_repository: ${{ vars.TOOLS_REPOSITORY || 'OneDragon-Anyone/plugin-tools' }}
      tools_ref: ${{ vars.TOOLS_REF }}  # 读仓库变量，留空就用最新 tag
      site_url: ${{ vars.SITE_URL }}  # 用自定义域名时配
      site_base_path: ${{ vars.SITE_BASE_PATH || '/plugin-data' }}  # 仓库改名后要跟着改
