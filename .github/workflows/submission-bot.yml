name: Submission Bot

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: submission-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # 默认两边都取最新，不用改
  #
  # 固定市场版本 —— 二选一，@ 后面只能写死，不能写变量：
  #   uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-submission-bot.yml@v1  # 用 v1 tag 的代码，不再变，其他版本以此类推
  #   uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-submission-bot.yml@master  # 用 master 分支最新代码
  #
  # 固定模板版本 —— 二选一：
  #   template_ref: v1  # 用 v1 tag 的代码，不再变，其他版本以此类推
  #   template_ref: ${{ vars.TEMPLATE_REF }}  # 读仓库变量，留空就用最新 tag
  bot:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/recheck')) ||
      (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/sync'))
    uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-submission-bot.yml@master  # 用 master 分支最新代码
    with:
      template_repository: ${{ vars.TEMPLATE_REPOSITORY || 'OneDragon-Anyone/plugin-template' }}
      template_ref: ${{ vars.TEMPLATE_REF }}  # 读仓库变量，留空就用最新 tag
