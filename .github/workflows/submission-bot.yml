name: Submission Bot

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: submission-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bot:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/recheck'))
    runs-on: ubuntu-latest
    steps:
      # 始终检出默认分支，pull_request_target 下也不运行 PR 中的代码
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout template tools
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.TEMPLATE_REPOSITORY || 'OneDragon-Anyone/plugin-template' }}
          ref: ${{ vars.TEMPLATE_REF || 'v1' }}
          path: .plugin-template
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run submission bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEMPLATE_DIR: .plugin-template
          REGISTRY_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REGISTRY_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}/plugin-registry/
        run: pnpm registry:bot
