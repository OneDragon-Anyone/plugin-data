name: Build Market

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: build-market
  cancel-in-progress: false

jobs:
  build:
    uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-build.yml@v1
    with:
      template_repository: ${{ vars.TEMPLATE_REPOSITORY || 'OneDragon-Anyone/plugin-template' }}
      template_ref: ${{ vars.TEMPLATE_REF || 'v1' }}
    secrets: inherit
