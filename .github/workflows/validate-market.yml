name: validate-market

on:
  pull_request:

permissions:
  contents: read

jobs:
  # 默认两边都取最新，不用改
  #
  # 固定市场版本 —— 二选一，@ 后面只能写死，不能写变量：
  #   uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-validate-market.yml@v1  # 用 v1 tag 的代码，不再变，其他版本以此类推
  #   uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-validate-market.yml@master  # 用 master 分支最新代码
  #
  # 固定工具版本 —— 二选一：
  #   tools_ref: v1  # 用 v1 tag 的代码，不再变，其他版本以此类推
  #   tools_ref: ${{ vars.TOOLS_REF }}  # 读仓库变量，留空就用最新 tag
  validate:
    uses: OneDragon-Anyone/plugin-market/.github/workflows/reusable-validate-market.yml@master  # 用 master 分支最新代码
    with:
      tools_repository: ${{ vars.TOOLS_REPOSITORY || 'OneDragon-Anyone/plugin-tools' }}
      tools_ref: ${{ vars.TOOLS_REF }}  # 读仓库变量，留空就用最新 tag
