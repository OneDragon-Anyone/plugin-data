name: Check repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check repository URLs
        shell: bash
        run: |
          set +e
          echo "## Repository health" >> "$GITHUB_STEP_SUMMARY"
          missing=0
          repos=$(jq -r 'to_entries[] | "\(.key) \(.value.repo)"' registry/plugins.json)
          while read -r id repo; do
            if [ -z "$id" ]; then
              continue
            fi
            code=$(curl -L --head --silent --output /dev/null --write-out "%{http_code}" --max-time 8 --retry 2 "$repo")
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "- ✅ $id $repo ($code)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⚠️ $id $repo ($code)" >> "$GITHUB_STEP_SUMMARY"
              missing=$((missing + 1))
            fi
          done <<< "$repos"
          echo "Warnings: $missing" >> "$GITHUB_STEP_SUMMARY"
